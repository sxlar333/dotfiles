font_size 14
confirm_os_window_close 0
window_padding_width 10
font_family IosevkaTermSlab Nerd Font Mono



# BEGIN_KITTY_THEME
# Belafonte Day
include current-theme.conf
# END_KITTY_THEME

# ── Tab bar ────────────────────────────────────────────────────────────────
# Powerline-style tabs with slanted (diagonal) separators, using the same
# palette as the Neovim/NvChad tabline.

tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_align left
tab_bar_min_tabs 1
tab_bar_show_new_tab_button yes

# Let the bar float instead of touching the window/content edges.
tab_bar_margin_width 12.0
tab_bar_margin_height 4.0 6.0
tab_bar_margin_color #d4ccb9

tab_bar_background #c9c1ae
active_tab_background #d4ccb9
active_tab_foreground #45363b
active_tab_font_style bold
inactive_tab_background #c2baa7
inactive_tab_foreground #6b6259
inactive_tab_font_style normal

# Superscript index + title, capped so tabs stay tidy.
tab_title_template "{sup.index}  {title}"
active_tab_title_template "{sup.index}  {title}"
tab_title_max_length 32
