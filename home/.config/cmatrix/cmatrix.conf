# ~/.config/cmatrix/cmatrix.conf
#
# NOTE: cmatrix 2.0 has no config-file support of its own. This file is read by
# the `cmatrix-theme` launcher (sourced as shell), which translates the kitty
# theme colours into the eight colour names cmatrix understands.
#
# cmatrix can only pick from: green red blue white yellow cyan magenta black
# Those eight map onto your kitty palette like this:
#   green   -> color2      blue    -> color4      cyan    -> color6
#   red     -> color1      magenta -> color5      white   -> color7
#   yellow  -> color3      black   -> foreground

# Kitty theme file (the one kitty.conf includes).
KITTY_THEME="$HOME/.config/kitty/current-theme.conf"

# Colour the rain should use. Anything from the theme works:
#   green | red | blue | white | yellow | cyan | magenta | black
#   foreground | background | cursor | color0 ... color15
#   auto        -> the theme accent with the best contrast on the background
#   #rrggbb     -> arbitrary hex, snapped to the nearest cmatrix colour
#
# Run `cmatrix-theme --print-color` to see what a value resolves to.
# The environment variable CMATRIX_COLOR overrides this for one run.
CMATRIX_COLOR="${CMATRIX_COLOR:-green}"

# Extra cmatrix flags (-a async scroll, -b random bold, -u speed 0-10, ...).
CMATRIX_OPTS="${CMATRIX_OPTS:--ab}"

# Binary to run. Defaults to ~/.local/bin/cmatrix-themed (a local build that
# leaves the background transparent) and falls back to the system cmatrix.
# CMATRIX_BIN=cmatrix

# vim: ft=sh
